    <script>
        // --- ADMIN JS OVERRIDE (To keep the dashboard running) ---
        const API = 'http://localhost:3000'; // CHANGE TO YOUR LIVE VERCEl/RENDER URL IF HOSTING

        // Load Payments
        async function loadPayments() {
            const list = document.getElementById('paymentList');
            try {
                const res = await fetch(`${API}/api/admin/payments`);
                const data = await res.json();
                if(data.length === 0) return list.innerHTML = '<div class="empty-state">No pending payments found.</div>';
                list.innerHTML = data.map(p => `
                    <div class="transaction-item">
                        <div class="txn-info">
                            <strong>${p.username}</strong>
                            <span>Txn ID: ${p.transaction_id}</span>
                        </div>
                        <div class="txn-action">
                            <span class="amount">Rs. ${p.amount}</span>
                            <button class="btn-verify" onclick="verifyPayment(${p.id})">Verify</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="error-state">Could not connect to server.</div>';
            }
        }

        async function verifyPayment(id) {
            await fetch(`${API}/api/admin/verify-payment`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ payment_id: id })
            });
            loadPayments();
        }
        loadPayments();

        // Admin Chat
        async function adminSendMessage() {
            const input = document.getElementById('adminMsg');
            if(!input.value) return;
            await fetch(`${API}/api/admin/send-message`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ assignment_id: 104, message: input.value })
            });
            input.value = '';
            loadAdminChat();
        }

        async function loadAdminChat() {
            const div = document.getElementById('adminChat');
            try {
                const res = await fetch(`${API}/api/get-messages/104`);
                const msgs = await res.json();
                if(msgs.length === 0) {
                    return div.innerHTML = '<div class="empty-state">No messages yet.</div>';
                }
                div.innerHTML = msgs.map(m => `
                    <div class="chat-bubble ${m.is_admin ? 'admin-msg' : 'student-msg'}">
                        <strong>${m.is_admin ? 'Admin' : 'Student'}:</strong>
                        <span>${m.message}</span>
                        ${m.file_url ? `<a href="${m.file_url}" target="_blank" style="color:#63b3ed; margin-left:5px;">📎</a>` : ''}
                    </div>
                `).join('');
                div.scrollTop = div.scrollHeight;
            } catch(e) {
                div.innerHTML = '<div class="error-state">Server disconnected.</div>';
            }
        }
        setInterval(loadAdminChat, 5000); // Check every 5 seconds
        loadAdminChat();
    </script>
